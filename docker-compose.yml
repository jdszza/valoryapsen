
# ═══════════════════════════════════════════════════════════════════════════════
# APSEN - Sistema de Contagem de Medicamentos v3.2 (Arquitetura REST/HTTP)
#
# 13 serviços (sem MQTT):
#   mysql               → banco de dados MySQL 8 (porta 3306)
#   central-computer    → FastAPI: orquestrador + API REST + WebSocket (porta 8000)
#   dispenser-adapter   → bridge: central ↔ dispenser-simulator (porta 8100)
#   cnc-adapter         → bridge: central ↔ cnc-simulator (porta 8101)
#   vision-adapter      → bridge: central ↔ vision-simulator (porta 8102)
#   weight-adapter      → bridge: central ↔ weight-simulator/HX711 (porta 8103)
#   dispenser-simulator → simula os dispensers físicos (NUM_SLOTS, default 8,
#                         em duas fileiras), HTTP server (porta 8201)
#   cnc-simulator       → simula firmware CNC, HTTP server (porta 8200)
#   vision-simulator    → simula as 3 câmeras: uma por fileira de dispensers e
#                         a da mesa/balança (porta 8202)
#   weight-simulator    → simula célula de carga HX711 na mesa (porta 8203)
#   order-generator     → gera OS aleatórias e envia ao central via HTTP
#   dashboard           → Plotly Dash: monitoramento read-only (porta 8050)
#   ihm_web             → Plotly Dash: IHM de manutenção com auth (porta 8051)
#
# Rebuild completo:
#   docker compose down -v && docker compose build --no-cache && docker compose up -d
# ═══════════════════════════════════════════════════════════════════════════════

# Healthcheck: as imagens são python:slim e não têm curl nem wget. O urllib da
# stdlib resolve, e é o mesmo interpretador que já roda o serviço.
#
# Nos ADAPTERS o teste é /ping (só o processo), não /health. Duas razões: (a)
# /health devolve 200 mesmo "degradado", então nem serviria de portão sem
# interpretar o corpo; (b) e se servisse, seria pior — atrelar a saúde do
# adapter à do central faria uma reinicialização do central marcar os quatro
# adapters como unhealthy em cascata, sendo que eles toleram central fora do ar
# (o _post retenta). /health continua sendo o endpoint de diagnóstico.
x-healthcheck: &healthcheck-padrao
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:

  # ── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: apsen-mysql
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      # Credenciais vêm do .env (não versionado). O modelo do arquivo está no
      # README, em "Como rodar" — não há .env.example no repositório.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:?defina MYSQL_ROOT_PASS no .env}
      MYSQL_DATABASE:      ${MYSQL_DB:-apsen_db}
      MYSQL_USER:          ${MYSQL_USER:-apsen}
      MYSQL_PASSWORD:      ${MYSQL_PASS:?defina MYSQL_PASS no .env}
    volumes:
      - mysql_data:/var/lib/mysql
      # Só charset/collation do banco. O schema (tabelas, colunas, seeds) é
      # criado pelo central-computer a cada startup — ver CLAUDE.md.
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Nomes do .env, não os do container: em `test` na forma exec não há
      # shell, quem interpola é o próprio Compose, antes de subir.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER:-apsen}", "-p${MYSQL_PASS:?defina MYSQL_PASS no .env}"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - apsen-net

  # ── Computador Central ──────────────────────────────────────────────────────
  central-computer:
    build: ./central-computer
    container_name: apsen-central
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8000:8000"   # API REST + WebSocket /ws
    environment:
      MYSQL_HOST:             mysql
      MYSQL_PORT:             3306
      MYSQL_DB:               apsen_db
      MYSQL_USER:             ${MYSQL_USER:-apsen}
      MYSQL_PASS:             ${MYSQL_PASS:?defina MYSQL_PASS no .env}
      # Segredos: todos do .env, nenhum versionado. O central RECUSA subir com
      # SECRET_KEY default fora de APSEN_ENV=dev — ver README.
      APSEN_ENV:              ${APSEN_ENV:-prod}
      SECRET_KEY:             ${SECRET_KEY:?gere com python -c "import secrets; print(secrets.token_hex(32))"}
      SEED_ADMIN_SENHA:       ${SEED_ADMIN_SENHA:?defina SEED_ADMIN_SENHA no .env}
      SEED_MANUT_SENHA:       ${SEED_MANUT_SENHA:?defina SEED_MANUT_SENHA no .env}
      # Origens de browser autorizadas (dashboard e IHM).
      CORS_ORIGINS:           ${CORS_ORIGINS:-http://localhost:8050,http://localhost:8051}
      # Nº de dispensers da célula (par: duas fileiras frente a frente).
      # Uma variável só para todos os serviços — ver CLAUDE.md.
      NUM_SLOTS:          ${NUM_SLOTS:-8}
      DISPENSER_ADAPTER_URL:  http://dispenser-adapter:8100
      CNC_ADAPTER_URL:        http://cnc-adapter:8101
      VISION_ADAPTER_URL:     http://vision-adapter:8102
      WEIGHT_ADAPTER_URL:     http://weight-adapter:8103
      TIMEOUT_CARREGAMENTO:   180
      TIMEOUT_POSICIONAMENTO: 120
      TIMEOUT_DISPENSA:       120
      TIMEOUT_VISAO_DISPENSER: 30
      TIMEOUT_VISAO_MESA:      30
      TIMEOUT_PESO:            15
      # Nº de fontes do Triple Check que precisam divergir para travar a OS.
      # 1 = regra conservadora (default). Faixa 1..3 — ver README.
      TRIPLE_CHECK_MIN_DIVERGENCIAS: 1
      # Teto de OS ESPERANDO na fila (a em execução já saiu dela). Atingido o
      # teto, POST /api/v1/ordens responde 429 sem persistir. Faixa 1..1000.
      MAX_FILA_OS: 5
      # Volume de escrita/broadcast: throttle dos eventos periódicos, amostragem
      # da trajetória da CNC (0 = não grava) e retenção do histórico.
      BROADCAST_MIN_INTERVALO_MS: 500
      CNC_AMOSTRAGEM_MOVENDO:     0
      RETENCAO_DIAS:              30
      EXPURGO_INTERVALO_HORAS:    24
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-padrao
      # init_db + seeds do catálogo depois do MySQL ficar pronto.
      start_period: 45s
      retries: 10
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── Dispenser Adapter ────────────────────────────────────────────────────────
  dispenser-adapter:
    build: ./dispenser-adapter
    container_name: apsen-dispenser-adapter
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      CENTRAL_URL:       http://central-computer:8000
      DISPENSER_SIM_URL: http://dispenser-simulator:8201
      TIMEOUT_CMD:       15
      TIMEOUT_EVENT:     5
    depends_on:
      # `service_healthy`, não só `service_started`: o adapter fala com o
      # simulador no lifespan e com o central no primeiro evento. O central NÃO
      # depende dos adapters no compose — seria ciclo, e ele tolera adapter
      # fora do ar (o _post retenta).
      central-computer:
        condition: service_healthy
      dispenser-simulator:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-padrao
      # o lifespan espera o simulador por até 60s antes de servir.
      start_period: 70s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── CNC Adapter ──────────────────────────────────────────────────────────────
  cnc-adapter:
    build: ./cnc-adapter
    container_name: apsen-cnc-adapter
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8101:8101"
    environment:
      CENTRAL_URL:  http://central-computer:8000
      CNC_SIM_URL:  http://cnc-simulator:8200
      TIMEOUT_CMD:  15
      TIMEOUT_EVENT: 5
    depends_on:
      central-computer:
        condition: service_healthy
      cnc-simulator:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-padrao
      # o lifespan espera o simulador por até 60s antes de servir.
      start_period: 70s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── Vision Adapter ───────────────────────────────────────────────────────────
  vision-adapter:
    build: ./vision-adapter
    container_name: apsen-vision-adapter
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8102:8102"
    environment:
      CENTRAL_URL:    http://central-computer:8000
      VISION_SIM_URL: http://vision-simulator:8202
      TIMEOUT_CMD:    20
      TIMEOUT_EVENT:  5
    depends_on:
      central-computer:
        condition: service_healthy
      vision-simulator:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-padrao
      # o lifespan espera o simulador por até 60s antes de servir.
      start_period: 70s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── Weight Adapter ───────────────────────────────────────────────────────────
  weight-adapter:
    build: ./weight-adapter
    container_name: apsen-weight-adapter
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8103:8103"
    environment:
      CENTRAL_URL:    http://central-computer:8000
      WEIGHT_SIM_URL: http://weight-simulator:8203
      TIMEOUT_CMD:    10
      TIMEOUT_EVENT:  5
    depends_on:
      central-computer:
        condition: service_healthy
      weight-simulator:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-padrao
      # o lifespan espera o simulador por até 60s antes de servir.
      start_period: 70s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── Weight Simulator (HX711) ─────────────────────────────────────────────────
  weight-simulator:
    build: ./weight-simulator
    container_name: apsen-weight-sim
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8203:8203"
    environment:
      ADAPTER_URL:       http://weight-adapter:8103
      # Nº de dispensers da célula (par: duas fileiras frente a frente).
      # Uma variável só para todos os serviços — ver CLAUDE.md.
      NUM_SLOTS:          ${NUM_SLOTS:-8}
      TOLERANCIA_PERC:   5.0    # tolerância de peso em %
      PROB_ERRO_SENSOR:  0.01   # probabilidade de falha do sensor HX711
      T_LEITURA:         1.5    # tempo de estabilização da leitura (s)
      RUIDO_G:           2.0    # ruído gaussiano simulado (g)
    healthcheck:
      <<: *healthcheck-padrao
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8203/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── Vision Simulator ──────────────────────────────────────────────────────────
  vision-simulator:
    build: ./vision-simulator
    container_name: apsen-vision-sim
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8202:8202"
    environment:
      ADAPTER_URL:                   http://vision-adapter:8102
      # Nº de dispensers da célula (par: duas fileiras frente a frente).
      # Uma variável só para todos os serviços — ver CLAUDE.md.
      NUM_SLOTS:          ${NUM_SLOTS:-8}
      # As três variáveis de dispenser valem para AS DUAS câmeras de fileira.
      # Para simular UMA câmera com problema (sem mexer na outra), acrescente
      # aqui a mesma variável com sufixo _ESQ ou _DIR — ex.:
      #   PROB_FALHA_LEITURA_DISPENSER_DIR: 0.30
      # O sufixo tem precedência; sem ele, vale o valor compartilhado.
      PROB_FALHA_LEITURA_DISPENSER:  0.02   # 2% falha câmera dispenser
      PROB_DIVERGENCIA_DISPENSER:    0.02   # 2% SKU errado no dispenser
      T_SCAN_DISPENSER:              1.5    # segundos processamento scan dispenser
      # Câmera da mesa (a da balança HX711) — uma só, sem lado a sobrescrever.
      PROB_FALHA_LEITURA_MESA:       0.02   # 2% câmera mesa não detecta
      PROB_DIVERGENCIA_MESA:         0.02   # 2% contagem errada na mesa
      T_SCAN_MESA:                   2.0    # segundos processamento scan mesa
    healthcheck:
      <<: *healthcheck-padrao
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8202/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── Dispenser Simulator ───────────────────────────────────────────────────────
  dispenser-simulator:
    build: ./dispenser_simulator
    container_name: apsen-dispenser-sim
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8201:8201"
    environment:
      ADAPTER_URL:        http://dispenser-adapter:8100
      # Nº de dispensers da célula (par: duas fileiras frente a frente).
      # Uma variável só para todos os serviços — ver CLAUDE.md.
      NUM_SLOTS:          ${NUM_SLOTS:-8}
      T_CARGA_UNID:       0.3
      T_DISPENSA_UNID:    0.5
      PROB_ERRO_MECANICO: 0.01   # falha mecânica (atolamento) — CV movido para vision-adapter
    healthcheck:
      <<: *healthcheck-padrao
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8201/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── CNC Simulator ────────────────────────────────────────────────────────────
  cnc-simulator:
    build: ./cnc_simulator
    container_name: apsen-cnc-sim
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      ADAPTER_URL: http://cnc-adapter:8101
      # Nº de dispensers da célula (par: duas fileiras frente a frente).
      # Uma variável só para todos os serviços — ver CLAUDE.md.
      NUM_SLOTS:          ${NUM_SLOTS:-8}
      # HOME é o fallback: o central manda as coordenadas em cada comando.
      HOME_X:      -120
      HOME_Y:      0
      VEL_MM_S:    80
      INTERVALO:   0.5
    healthcheck:
      <<: *healthcheck-padrao
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/ping', timeout=3)"]
    networks:
      - apsen-net

  # ── Order Generator ───────────────────────────────────────────────────────────
  # Sem healthcheck de propósito: é um worker de laço, não expõe porta nem
  # endpoint, e nenhum serviço depende dele. Um teste artificial (pgrep) só
  # diria que o processo existe, que é o que o `restart: unless-stopped` já
  # cobre. Ver tests/test_compose.py, que registra a exceção.
  order-generator:
    build: ./order-generator
    container_name: apsen-order-gen
    logging: *default-logging
    restart: unless-stopped
    environment:
      CENTRAL_URL:         http://central-computer:8000
      INTERVALO_OS:        90
      RELOAD_CATALOGO_MIN: 30
      # Backpressure: espera entre consultas quando a fila do central está
      # cheia, e quantas esperas antes de pular o ciclo. Ver README.
      ESPERA_FILA_CHEIA:   20
      MAX_ESPERAS_FILA:    15
      MIN_MEDS_POR_OS:     2
      MAX_MEDS_POR_OS:     6
      QTD_MIN:             2
      QTD_MAX:             15
    depends_on:
      # Não basta o central: quem EXECUTA a OS são os adapters, e eles só
      # sobem depois que o central fica healthy — ou seja, em paralelo com
      # este gerador. Sem esperá-los, a primeira OS do boot saía antes de o
      # dispenser-adapter estar ouvindo, tomava `connection refused` e morria
      # em timeout de carregamento. Aciclico: gerador → adapters → central.
      central-computer:
        condition: service_healthy
      dispenser-adapter:
        condition: service_healthy
      cnc-adapter:
        condition: service_healthy
      vision-adapter:
        condition: service_healthy
      weight-adapter:
        condition: service_healthy
    networks:
      - apsen-net

  # ── Dashboard de Monitoramento ──────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: apsen-dashboard
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8050:8050"
    environment:
      BACKEND_URL: http://central-computer:8000
      # Nº de dispensers da célula (par: duas fileiras frente a frente).
      # Uma variável só para todos os serviços — ver CLAUDE.md.
      NUM_SLOTS:          ${NUM_SLOTS:-8}
      POLL_MS:     2000
    depends_on:
      central-computer:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-padrao
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/', timeout=3)"]
    networks:
      - apsen-net

  # ── IHM de Manutenção ────────────────────────────────────────────────────────
  ihm_web:
    build: ./ihm_web
    container_name: apsen-ihm
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8051:8051"
    environment:
      BACKEND_URL: http://central-computer:8000
      POLL_MS:     5000
    depends_on:
      central-computer:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-padrao
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8051/', timeout=3)"]
    networks:
      - apsen-net

volumes:
  mysql_data:

networks:
  apsen-net:
    driver: bridge
