<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar PIN — Apsen Farmacêutica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
<div class="login-card">
    <h4 class="fw-bold mb-1">Trocar PIN</h4>

    {% if provisorio %}
    <div class="alert alert-warning small mt-3" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>
        Seu PIN ainda é o de fábrica, e ele está publicado junto com o sistema.
        Escolha um novo para continuar.
    </div>
    {% else %}
    <p class="text-muted small mt-2">Escolha um PIN novo de 4 dígitos.</p>
    {% endif %}

    {% if erro %}
    <div class="alert alert-danger small" role="alert">{{ erro }}</div>
    {% endif %}

    <form method="POST" autocomplete="off">
        <div class="mb-3">
            <label class="form-label small fw-semibold">PIN atual</label>
            <input type="password" name="pin_atual" class="form-control"
                   inputmode="numeric" maxlength="4" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">PIN novo</label>
            <input type="password" name="pin_novo" class="form-control"
                   inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
        </div>
        <div class="mb-4">
            <label class="form-label small fw-semibold">Confirme o PIN novo</label>
            <input type="password" name="pin_confirma" class="form-control"
                   inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">
            <i class="bi bi-key me-1"></i>Salvar
        </button>
    </form>

    <a href="{{ url_for('logout') }}" class="d-block text-center small text-muted mt-3">
        Sair
    </a>
</div>
</body>
</html>
