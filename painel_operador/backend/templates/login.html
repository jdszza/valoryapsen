<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Apsen Farmacêutica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        .brand-logo {
            width: 56px; height: 56px;
            background: #2563EB;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.6rem;
            margin: 0 auto 1rem;
        }
        .form-control:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .btn-login {
            background: #2563EB; color: #fff; border: none;
            border-radius: 10px; padding: .75rem; font-size: 1rem; font-weight: 600;
            transition: background .15s;
        }
        .btn-login:hover { background: #1D4ED8; color: #fff; }
        .perfil-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-logo"><i class="bi bi-capsule-pill"></i></div>
        <h4 class="text-center fw-bold mb-0">APSEN Farmacêutica</h4>
        <p class="text-center text-muted mb-4" style="font-size:.85rem">Sistema de Dispensação — Acesso Web</p>

        {% if erro %}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Nome</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" name="nome" class="form-control border-start-0"
                           placeholder="Seu nome completo" autofocus required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">PIN</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-shield-lock text-muted"></i>
                    </span>
                    <input type="password" name="pin" class="form-control border-start-0 font-monospace"
                           placeholder="••••" required maxlength="12" inputmode="numeric">
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>

        <hr class="my-4">
        <div class="text-center">
            <p class="small text-muted mb-2">Perfis de acesso web:</p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <span class="perfil-badge" style="background:#FEE2E2;color:#991B1B">
                    <i class="bi bi-shield-fill"></i> Admin
                </span>
                <span class="perfil-badge" style="background:#DBEAFE;color:#1D4ED8">
                    <i class="bi bi-clipboard-data"></i> PCP
                </span>
                <span class="perfil-badge" style="background:#DCFCE7;color:#166534">
                    <i class="bi bi-tools"></i> PCM
                </span>
            </div>
            <p class="text-muted mt-2" style="font-size:.75rem">
                Perfil <strong>Operador</strong> usa somente o display físico.
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
