[env:esp32s3box]
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino
board_build.partitions = huge_app.csv
; O firmware fala 115200 (display.h: Serial.begin). Sem esta linha o
; `pio device monitor` abre a 9600 e mostra lixo — e o sintoma parece
; firmware quebrado, nao monitor mal configurado.
monitor_speed = 115200
build_src_filter = +<*>
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I src/
    -DBOARD_HAS_PSRAM
    ; O board esp32s3box (devkit oficial) assume USB nativo (ARDUINO_USB_MODE=1),
    ; que usa os pinos GPIO19/20 para D-/D+. Esta placa fisica usa esses mesmos
    ; pinos para I2C do touch (ver display.h) e tem um CH340 externo para
    ; USB/serial — por isso forcamos Serial de volta para a UART0 classica.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
	lvgl/lvgl@^9.2.2
	tamctec/TAMC_GT911@^1.0.2
	moononournation/GFX Library for Arduino@1.5.0
	bblanchon/ArduinoJson@^7.0.0
