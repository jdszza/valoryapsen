# Mosquitto Broker - APSEN Sistema de Contagem
# Porta MQTT padrão (ESP32, backend Python)
listener 1883
allow_anonymous true

# Porta WebSocket (opcional: dash pode assinar direto ao broker)
listener 9001
protocol websockets
allow_anonymous true

# Persistência de mensagens retained
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type all
